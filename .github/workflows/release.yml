# Build the selected source SHA without bumping it. Windows precedes macOS;
# publish only after signing, strict verification, both notarizations and staple.
# The actual projects use test/Plugins, not a .4dbase directory.

name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_NAME: maddy
  MACOS_DEPLOYMENT_TARGET: '10.13'
  BASE_DIR: test

concurrency:
  group: release
  cancel-in-progress: false

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: read selected source version
        id: set
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/version.py read --github-output "$GITHUB_OUTPUT"

      - name: reject existing release or tag
        shell: bash
        env:
          TAG: ${{ steps.set.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py check --tag "$TAG"

  build-windows:
    name: Build Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: clean stale outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $product = $env:PRODUCT_NAME
          $base = $env:BASE_DIR
          $generated = @(
            "$base/plugins/$product.bundle/contents/windows64/$product.4DX",
            "Objs/Release"
          )
          foreach ($path in $generated) {
            if (Test-Path -LiteralPath $path) {
              Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop
            }
          }

      - name: build x64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          msbuild "$env:PRODUCT_NAME.sln" /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /m
          if ($LASTEXITCODE -ne 0) {
            throw "MSBuild failed with exit code $LASTEXITCODE"
          }

      - name: normalize windows output to canonical case
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $product = $env:PRODUCT_NAME
          $base = $env:BASE_DIR
          $source = "$base/plugins/$product.bundle/contents/windows64/$product.4DX"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Expected Windows output not found: $source"
          }
          if ((Get-Item -LiteralPath $source).Length -le 0) {
            throw "Windows output is empty: $source"
          }
          $canonicalDir = "$base/Plugins/$product.bundle/Contents/Windows64"
          New-Item -ItemType Directory -Force -Path $canonicalDir | Out-Null

          $destination = Join-Path $canonicalDir "$product.4DX"
          $sourceResolved = (Resolve-Path -LiteralPath $source).Path
          $destResolved = $null
          if (Test-Path -LiteralPath $destination) {
            $destResolved = (Resolve-Path -LiteralPath $destination).Path
          }
          # MSBuild and the canonical path identify the same file on Windows.
          if (-not $destResolved -or ($sourceResolved -ine $destResolved)) {
            Copy-Item -LiteralPath $source -Destination $destination -Force -ErrorAction Stop
          }
          Get-ChildItem $canonicalDir

      - name: upload windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: ${{ env.BASE_DIR }}/Plugins/${{ env.PRODUCT_NAME }}.bundle/Contents/Windows64/${{ env.PRODUCT_NAME }}.4DX
          if-no-files-found: error

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version, build-windows]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: download windows binaries
        uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: winbuild

      - name: import Developer ID certificate
        shell: bash
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: store notarytool credentials
        shell: bash
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: build macOS plugin (universal)
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT="$PRODUCT_NAME"
          BASE="$BASE_DIR"
          XCODE_PROJECT="${PRODUCT}.xcodeproj"
          XCODE_TARGET="${PRODUCT}"
          PLUGINS_DIR="${BASE}/Plugins"

          # Remove only generated metadata, executables, signatures and intermediates.
          # Keep tracked Resources, QuickLook and Windows payloads in place.
          for OUTPUT_DIR in "$PLUGINS_DIR" "$PLUGINS_DIR/Default"; do
            CONTENTS="$OUTPUT_DIR/${PRODUCT}.bundle/Contents"
            rm -f "$CONTENTS/MacOS/$PRODUCT" "$CONTENTS/Info.plist" \
              "$CONTENTS/Resources/English.lproj/InfoPlist.strings"
            rm -rf "$CONTENTS/_CodeSignature" "$OUTPUT_DIR/${PRODUCT}.build"
          done
          rm -rf "build/${PRODUCT}.build"

          echo "Building $XCODE_PROJECT target $XCODE_TARGET"
          xcodebuild -project "$XCODE_PROJECT" \
            -target "$XCODE_TARGET" \
            -configuration Default \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET" \
            CODE_SIGNING_ALLOWED=NO \
            CONFIGURATION_BUILD_DIR="$PWD/$PLUGINS_DIR" \
            OBJROOT="$PWD/build" \
            build

          echo "Built:"
          ls -R "$PLUGINS_DIR"

      - name: verify universal binary
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT="$PRODUCT_NAME"
          BASE="$BASE_DIR"
          BIN="${BASE}/Plugins/${PRODUCT}.bundle/Contents/MacOS/${PRODUCT}"

          if [ ! -f "$BIN" ] || [ ! -s "$BIN" ]; then
            echo "::error::Expected nonempty binary not found at $BIN"
            exit 1
          fi

          ARCHITECTURES="$(lipo -archs "$BIN")"
          for REQUIRED_ARCH in arm64 x86_64; do
            case " $ARCHITECTURES " in
              *" $REQUIRED_ARCH "*) ;;
              *) echo "::error::Missing required architecture $REQUIRED_ARCH"; exit 1 ;;
            esac
          done
          python3 .github/scripts/version.py verify-built --bundle "${BASE}/Plugins/${PRODUCT}.bundle"

      - name: merge Windows binaries into the bundle
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT="$PRODUCT_NAME"
          BASE="$BASE_DIR"
          BUNDLE="${BASE}/Plugins/${PRODUCT}.bundle"

          mkdir -p "$BUNDLE/Contents/Windows64"

          SRC="winbuild/${PRODUCT}.4DX"
          if [ ! -f "$SRC" ] || [ ! -s "$SRC" ]; then
            echo "::error::Expected nonempty Windows binary not found at $SRC"
            exit 1
          fi

          echo "Copying $SRC -> $BUNDLE/Contents/Windows64/${PRODUCT}.4DX"
          cp "$SRC" "$BUNDLE/Contents/Windows64/${PRODUCT}.4DX"

          echo "BUNDLE_PATH=$BUNDLE" >> "$GITHUB_ENV"
          ls -R "$BUNDLE/Contents"

      - name: codesign
        shell: bash
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$IDENTITY" ]; then
            echo "::error::No Developer ID identity found"
            security find-identity -v -p codesigning "$KEYCHAIN_PATH"
            exit 1
          fi
          echo "Signing with: $IDENTITY"
          codesign --verbose --deep --timestamp --force --options=runtime \
            --sign "$IDENTITY" "$BUNDLE_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"

      - name: package, notarize & staple
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          PRODUCT="$PRODUCT_NAME"
          ZIP_PATH="${PRODUCT}-${VERSION}.zip"
          DMG_PATH="${PRODUCT}-${VERSION}.dmg"

          echo "Creating $ZIP_PATH"
          ditto -c -k --keepParent "$BUNDLE_PATH" "$ZIP_PATH"

          echo "Creating $DMG_PATH"
          hdiutil create -format UDBZ -volname "$PRODUCT" -srcfolder "$BUNDLE_PATH" "$DMG_PATH"

          xcrun notarytool submit "$ZIP_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait --output-format json > "$PRODUCT-$VERSION-zip-notary.json"
          python3 -c 'import json, sys; result = json.load(open(sys.argv[1])); sys.exit(0 if result.get("status") == "Accepted" else "ZIP notarization was not Accepted")' "$PRODUCT-$VERSION-zip-notary.json"
          xcrun notarytool submit "$DMG_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait --output-format json > "$PRODUCT-$VERSION-dmg-notary.json"
          python3 -c 'import json, sys; result = json.load(open(sys.argv[1])); sys.exit(0 if result.get("status") == "Accepted" else "DMG notarization was not Accepted")' "$PRODUCT-$VERSION-dmg-notary.json"
          xcrun stapler staple "$DMG_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"
          ls -lh "$ZIP_PATH" "$DMG_PATH"

      - name: create GitHub Release
        shell: bash
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py publish --tag "$TAG" --sha "$GITHUB_SHA" --asset "$ZIP_PATH" --asset "$DMG_PATH"
