name: Bump

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Source semantic version bump (does not build or release)
        options: [patch, minor, major]
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: maddy-source-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Bump selected branch source only
        env:
          SELECTED_REF: ${{ github.ref }}
          SELECTED_SHA: ${{ github.sha }}
          BUMP_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 .github/scripts/bump.py \
            --ref "$SELECTED_REF" --sha "$SELECTED_SHA" --mode "$BUMP_MODE"
